# Repository metadata only; the scripts are run directly and this is not a pip package.
[project]
name = "flower-steam-fixes"
version = "1.1.0"
description = "Reversible Flower audio fix and native ScePad Steam Input bridge"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["flower", "steam-input", "steam-deck", "modding"]

[project.urls]
Repository = "https://github.com/natryamar/flower-steam-fixes"
Issues = "https://github.com/natryamar/flower-steam-fixes/issues"

[tool.ruff]
target-version = "py310"
line-length = 88
